[server]
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
maxMessageSize = 200
headless = true
fileWatcherType = "auto"

[global]
developmentMode = false

[theme]
primaryColor = "#1E90FF"
backgroundColor = "#E8EAF6"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "verdana"

[browser]
gatherUsageStats = true
